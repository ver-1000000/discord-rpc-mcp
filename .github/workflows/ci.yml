name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm pack --dry-run
  binary:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: linux-x64
          - os: windows-latest
            artifact: windows-x64
          - os: macos-15
            artifact: macos-arm64
          - os: macos-15-intel
            artifact: macos-x64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build:binary
      - run: npm run test:binary
        timeout-minutes: 2
      - run: node scripts/smoke-installer.js
        timeout-minutes: 5
      - uses: actions/upload-artifact@v4
        with:
          name: discord-rpc-mcp-${{ matrix.artifact }}
          path: dist/
          include-hidden-files: true
          if-no-files-found: error
